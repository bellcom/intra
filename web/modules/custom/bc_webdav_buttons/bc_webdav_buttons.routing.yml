
bc_webdav_buttons.settings:
  path: '/admin/config/bellcom/webdav-buttons'
  defaults:
    _form: '\Drupal\bc_webdav_buttons\Form\BcWebdavButtonsForm'
    _title: 'Bellcom webdav buttons'
  requirements:
    _permission: 'administer site configuration'

bc_webdav_buttons.log:
  path: '/admin/config/bellcom/webdav-log'
  defaults:
    _controller: '\Drupal\bc_webdav_buttons\Controller\BcWebdavButtonsController::log'
    _title: 'WebDav Log'
  requirements:
    _permission: 'access content'

