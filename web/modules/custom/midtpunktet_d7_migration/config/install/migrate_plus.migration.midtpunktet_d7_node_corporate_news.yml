id: midtpunktet_d7_node_corporate_news
label: Midtpunktet D7 Node Corporate news
migration_group: midtpunktet_d7
migration_tags:
  - Drupal 7
  - Content
deriver: Drupal\node\Plugin\migrate\D7NodeDeriver
source:
  plugin: d7_node
  node_type: corporate_news
  track_changes: true
process:
  # If you are using this file to build a custom migration consider removing
  # the nid and vid fields to allow incremental migrations.
  # In D7, nodes always have a tnid, but it's zero for untranslated nodes.
  # We normalize it to equal the nid in that case.
  # @see \Drupal\node\Plugin\migrate\source\d7\Node::prepareRow().
  type:
    plugin: default_value
    default_value: os2web_news
  langcode:
    plugin: default_value
    source: language
    default_value: 'und'
  title: title
  field_os2web_news_heading: title
  status: status
  created: created
  changed: changed
  sticky: sticky
  field_os2web_news_article_date:
    - plugin: skip_row_if_old_news
      index: 0
      source: field_startdate
    - plugin: sub_process
      source: field_startdate
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: 'Y-m-d\TH:i:s'
          from_timezone: 'Europe/Copenhagen'
          source: value
  field_os2web_news_description:
    - plugin: sub_process
      source: body
      process:
        value: value
        format:
          plugin: default_value
          default_value: 'wysiwyg_tekst'
  field_os2web_news_intro:
    - plugin: default_value
      default_value: ''
  field_os2web_news_primaryimage:
    - plugin: sub_process
      source: field_file
      process:
        migrate_file_url_source:
          - plugin: callback
            source: fid
            callable:
              - 'Drupal\midtpunktet_d7_migration\Utility\MigrationHelper'
              - getFileDownloadUrl
        migrate_file_url_destination:
          - plugin: callback
            source: fid
            callable:
              - 'Drupal\midtpunktet_d7_migration\Utility\MigrationHelper'
              - generateFileDestinationPath
        migrate_file_fid:
          - plugin: skip_on_empty
            method: process
            source: '@migrate_file_url_source'
            message: 'Image is missing'
          - plugin: file_copy
            source:
              - '@migrate_file_url_source'
              - '@migrate_file_url_destination'
          - plugin: callback
            callable:
              - 'Drupal\midtpunktet_d7_migration\Utility\MigrationHelper'
              - createFileManaged
        target_id: '@migrate_file_fid'
  migrate_paragraph_files:
    plugin: migration_lookup
    migration: midtpunktet_d7_node_corporate_news_paragraph_files
    source: nid
    no_stub: true
  field_os2web_news_paragraph_narr:
    plugin: sub_process
    source:
      - '@migrate_paragraph_files'
    process:
      target_id: '0'
      target_revision_id: '1'
  moderation_state:
    plugin: callback
    callable:
      - 'Drupal\midtpunktet_d7_migration\Utility\MigrationHelper'
      - setModerationState
    source: status
destination:
  plugin: entity:node
migration_dependencies:
  required:
    - midtpunktet_d7_node_corporate_news_paragraph_files
