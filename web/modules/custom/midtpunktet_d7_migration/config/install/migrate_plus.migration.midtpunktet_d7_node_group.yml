id: midtpunktet_d7_node_group
label: Midtpunktet D7 Node Group
migration_group: midtpunktet_d7
migration_tags:
  - Drupal 7
  - Content
deriver: Drupal\node\Plugin\migrate\D7NodeDeriver
source:
  plugin: d7_node
  node_type: group
  track_changes: true
process:
  type:
    plugin: default_value
    default_value: os2web_group
  langcode:
    plugin: default_value
    source: language
    default_value: 'und'
  title: title
  body:
    - plugin: sub_process
      source: body
      process:
        value: value
        format:
          plugin: default_value
          default_value: 'wysiwyg_tekst'
  path/pathauto:
    plugin: default_value
    default_value: 0 # Disable pathauto.
  path/alias:
    - plugin: migrate_url_alias
    - plugin: skip_on_empty
      method: process
  skip_condition:
    - plugin: skip_group_condition
      index: 0
      source: field_group_category
  status: status
  created: created
  changed: changed
destination:
  plugin: entity:node
migration_dependencies:
  required: {}
  optional: {}
